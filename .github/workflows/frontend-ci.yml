name: Frontend CI

on:
  push:
    branches:
      - master
    paths:
      - "LojaDeCarroWeb/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    paths:
      - "LojaDeCarroWeb/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: LojaDeCarroWeb

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LojaDeCarroWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build -- --configuration production

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build frontend image
        run: |
          docker build \
            --tag lojadecarro-web:ci \
            .