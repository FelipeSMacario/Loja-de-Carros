name: Publish images to Amazon ECR

on:
  push:
    branches:
      - master
    paths:
      - "LojadeCarro/**"
      - "LojaDeCarroWeb/**"
      - "deploy/**"
      - ".github/workflows/publish-ecr.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ecr-master
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./LojadeCarro
            dockerfile: ./LojadeCarro/Dockerfile
            repository: ${{ vars.ECR_API_REPOSITORY }}

          - component: web
            context: ./LojaDeCarroWeb
            dockerfile: ./LojaDeCarroWeb/Dockerfile
            repository: ${{ vars.ECR_WEB_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        if: matrix.component == 'api'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: LojadeCarro/pom.xml

      - name: Build API JAR
        if: matrix.component == 'api'
        working-directory: ./LojadeCarro
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-ecr-${{ matrix.component }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:sha-${{ github.sha }}-run-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to EC2
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-ec2-deploy

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_attempt }}
        run: |
          PARAMETERS="$(
            jq -cn \
              --arg sha "${GITHUB_SHA}" \
              --arg tag "${IMAGE_TAG}" \
              '{
                commands: [
                  "set -Eeuo pipefail",
                  "SOURCE_DIR=/opt/loja-de-carros/source",
                  "mkdir -p \"${SOURCE_DIR}\"",
                  "if [ ! -d \"${SOURCE_DIR}/.git\" ]; then git init \"${SOURCE_DIR}\"; fi",
                  "git -C \"${SOURCE_DIR}\" remote remove origin >/dev/null 2>&1 || true",
                  "git -C \"${SOURCE_DIR}\" remote add origin https://github.com/FelipeSMacario/Loja-de-Carros.git",
                  "git -C \"${SOURCE_DIR}\" fetch --force --depth=1 origin \($sha)",
                  "git -C \"${SOURCE_DIR}\" checkout --detach --force FETCH_HEAD",
                  "chmod +x \"${SOURCE_DIR}/deploy/ec2/deploy.sh\"",
                  "\"${SOURCE_DIR}/deploy/ec2/deploy.sh\" \($tag)"
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Loja de Carros ${GITHUB_SHA}" \
              --timeout-seconds 600 \
              --parameters "${PARAMETERS}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: ${COMMAND_ID}"

          FINAL_STATUS=""

          for _ in {1..120}; do
            FINAL_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            case "${FINAL_STATUS}" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          echo "Status: ${FINAL_STATUS}"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text || true

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text >&2 || true

          if [ "${FINAL_STATUS}" != "Success" ]; then
            echo "Deployment failed with status ${FINAL_STATUS}." >&2
            exit 1
          fi
