name: Publish images to Amazon ECR

on:
  push:
    branches:
      - master
    paths:
      - 'LojadeCarro/**'
      - 'LojaDeCarroWeb/**'
      - '.github/workflows/publish-ecr.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ecr-master
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./LojadeCarro
            dockerfile: ./LojadeCarro/Dockerfile
            repository: ${{ vars.ECR_API_REPOSITORY }}

          - component: web
            context: ./LojaDeCarroWeb
            dockerfile: ./LojaDeCarroWeb/Dockerfile
            repository: ${{ vars.ECR_WEB_REPOSITORY }}

        steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        if: matrix.component == 'api'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: LojadeCarro/pom.xml

      - name: Build API JAR
        if: matrix.component == 'api'
        working-directory: ./LojadeCarro
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-ecr-${{ matrix.component }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:sha-${{ github.sha }}-run-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}